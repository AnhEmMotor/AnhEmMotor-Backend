name: AnhEmMotor Backend - Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Prepare AppSettings
        run: |
          cp WebAPI/appsettings.Template.json appsettings.Production.json
          sed -i '/^[[:blank:]]*\/\//d' appsettings.Production.json
          sed -i 's|[[:blank:]]\+//.*||g' appsettings.Production.json
      - name: Inject Secrets
        env:
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          SUPER_ROLES_LIST: ${{ secrets.SUPER_ROLES_LIST || '[]' }}
          PROTECTED_USERS_LIST: ${{ secrets.PROTECTED_USERS_LIST || '[]' }}
          DEFAULT_ROLES_FOR_NEW_USER_LIST: ${{ secrets.DEFAULT_ROLES_FOR_NEW_USER_LIST || '[]' }}
          ENABLE_DATABASE_SEEDING: ${{ secrets.ENABLE_DATABASE_SEEDING || 'false' }}
          COOKIE_DOMAIN: ${{ secrets.COOKIE_DOMAIN }}
          OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          VNPAY_TMN_CODE: ${{ secrets.VNPAY__TMN_CODE }}
          VNPAY_HASH_SECRET: ${{ secrets.VNPAY__HASH_SECRET }}
          VNPAY_BASE_URL: ${{ secrets.VNPAY__BASE_URL }}
          VNPAY_CALLBACK_URL: ${{ secrets.VNPAY__CALLBACK_URL }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS__CLIENT_ID }}
          PAYOS_API_KEY: ${{ secrets.PAYOS__API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS__CHECKSUM_KEY }}
          PAYOS_BASE_URL: ${{ secrets.PAYOS__BASE_URL }}
          PAYOS_RETURN_URL: ${{ secrets.PAYOS__RETURN_URL }}
          PAYOS_CANCEL_URL: ${{ secrets.PAYOS__CANCEL_URL }}
          UPLOAD_PATH: ${{ secrets.UPLOAD_PATH }}
          GHN_TOKEN: ${{ secrets.GHN_TOKEN }}
          GHN_SHOP_ID: ${{ secrets.GHN_SHOP_ID }}
          GHN_BASE_URL: ${{ secrets.GHN_BASE_URL }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_API_ENDPOINT: ${{ secrets.AI_API_ENDPOINT }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING || 'false' }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_MEASUREMENT_ID_STORE: ${{ secrets.GA4_MEASUREMENT_ID_STORE }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_MP_API_SECRET: ${{ secrets.GA4_MP_API_SECRET }}
        run: >
          jq '
            .Provider = "PostgreSql" |
            .AllowedHosts = env.ALLOWED_HOSTS |
            .Cors.AllowedOrigins = env.CORS_ALLOWED_ORIGINS |
            .ConnectionStrings.StringConnection = env.DB_CONNECTION_STRING |
            .Jwt.Key = env.JWT_SECRET_KEY |
            .Jwt.Issuer = env.JWT_ISSUER |
            .Jwt.Audience = env.JWT_AUDIENCE |
            .ProtectedAuthorizationEntities.SuperRoles = (env.SUPER_ROLES_LIST | fromjson) |
            .ProtectedAuthorizationEntities.ProtectedUsers = (env.PROTECTED_USERS_LIST | fromjson) |
            .ProtectedAuthorizationEntities.DefaultRolesForNewUsers = (env.DEFAULT_ROLES_FOR_NEW_USER_LIST | fromjson) |
            .SeedingOptions.RunDataSeedingOnStartup = (env.ENABLE_DATABASE_SEEDING | fromjson) |
            .CookieDomain = env.COOKIE_DOMAIN |
            .OpenTelemetry.OtlpEndpoint = env.OTLP_ENDPOINT |
            .Authentication.Google.ClientId = env.GOOGLE_CLIENT_ID |
            .Authentication.Google.ClientSecret = env.GOOGLE_CLIENT_SECRET |
            .Authentication.Facebook.AppId = env.FACEBOOK_APP_ID |
            .Authentication.Facebook.AppSecret = env.FACEBOOK_APP_SECRET |
            .VNPay.TmnCode = env.VNPAY_TMN_CODE |
            .VNPay.HashSecret = env.VNPAY_HASH_SECRET |
            .VNPay.BaseUrl = env.VNPAY_BASE_URL |
            .VNPay.CallbackUrl = env.VNPAY_CALLBACK_URL |
            .PayOS.ClientId = env.PAYOS_CLIENT_ID |
            .PayOS.ApiKey = env.PAYOS_API_KEY |
            .PayOS.ChecksumKey = env.PAYOS_CHECKSUM_KEY |
            .PayOS.BaseUrl = env.PAYOS_BASE_URL |
            .PayOS.ReturnUrl = env.PAYOS_RETURN_URL |
            .PayOS.CancelUrl = env.PAYOS_CANCEL_URL |
            .LocalFileStorage.UploadPath = env.UPLOAD_PATH |
            .GhnSettings.Token = env.GHN_TOKEN |
            .GhnSettings.ShopId = env.GHN_SHOP_ID |
            .GhnSettings.BaseUrl = env.GHN_BASE_URL |
            .AISetup.Provider = (if env.AI_PROVIDER == "" then .AISetup.Provider else env.AI_PROVIDER end) |
            .AISetup.ApiEndpoint = env.AI_API_ENDPOINT |
            .AISetup.ApiKey = env.AI_API_KEY |
            .AISetup.Model = (if env.AI_MODEL == "" then .AISetup.Model else env.AI_MODEL end) |
            .AISetup.LangSmithTracing = (env.LANGSMITH_TRACING | fromjson) |
            .AISetup.LangSmithApiKey = env.LANGSMITH_API_KEY |
            .GoogleAnalytics4.PropertyId = env.GA4_PROPERTY_ID |
            .GoogleAnalytics4.MeasurementId = env.GA4_MEASUREMENT_ID_STORE |
            .GoogleAnalytics4.ServiceAccount = (if env.GA4_SERVICE_ACCOUNT_JSON == "" then {} else (env.GA4_SERVICE_ACCOUNT_JSON | fromjson) end) |
            .GoogleAnalytics4.MeasurementProtocolApiSecret = env.GA4_MP_API_SECRET
          ' appsettings.Production.json > tmp.json && mv tmp.json appsettings.Production.json
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build WebAPI/WebAPI.csproj --configuration Release --no-restore
      - name: Install EF Core Tools
        run: dotnet tool install --global dotnet-ef
      - name: Generate PostgreSQL Migration Bundle
        run: >
          cd Infrastructure

          dotnet ef migrations bundle --self-contained -r linux-x64 --context PostgreSqlDbContext --output ../postgres_bundle

          cd ..
        continue-on-error: true
      - name: Publish
        run: |
          dotnet publish WebAPI/WebAPI.csproj --configuration Release --no-build --output ./publish
          mkdir -p ./publish/wwwroot
          cp -r AISidecar ./publish/
          rm -rf ./publish/AISidecar/.venv ./publish/AISidecar/__pycache__
          cp -r SeedUploads ./publish/
          cp -r SharedConfig ./publish/
      - name: Move AppSettings to Publish Folder
        run: cp appsettings.Production.json ./publish/
      - name: Move Migration Bundle to Publish Folder
        run: |
          if [ -f postgres_bundle ]; then
            mv postgres_bundle ./publish/
          fi
        continue-on-error: true
      - name: Clean Remote Directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_SERVER_IP }}
          username: ${{ secrets.PRODUCTION_SERVER_USERNAME }}
          key: ${{ secrets.SERVER_REMOTE_ACCESS_PRIVATE_KEY }}
          port: ${{ secrets.PRODUCTION_SERVER_PORT || 22 }}
          timeout: 60s
          script: |
            # Xoá tất cả trừ thư mục uploads để tránh mất ảnh khi deploy
            find /var/www/anhemmotor/backend -mindepth 1 -maxdepth 1 -not -name 'wwwroot' -exec rm -rf {} +
      - name: Copy Files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PRODUCTION_SERVER_IP }}
          username: ${{ secrets.PRODUCTION_SERVER_USERNAME }}
          key: ${{ secrets.SERVER_REMOTE_ACCESS_PRIVATE_KEY }}
          port: ${{ secrets.PRODUCTION_SERVER_PORT || 22 }}
          timeout: 60s
          source: ./publish/*
          target: /var/www/anhemmotor/backend
          strip_components: 1
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_SERVER_IP }}
          username: ${{ secrets.PRODUCTION_SERVER_USERNAME }}
          key: ${{ secrets.SERVER_REMOTE_ACCESS_PRIVATE_KEY }}
          port: ${{ secrets.PRODUCTION_SERVER_PORT || 22 }}
          timeout: 60s
          script: >
            if [ -f /var/www/anhemmotor/backend/postgres_bundle ]; then
              chmod +x /var/www/anhemmotor/backend/postgres_bundle
              /var/www/anhemmotor/backend/postgres_bundle --connection "${{ secrets.DB_CONNECTION_STRING }}"
              rm /var/www/anhemmotor/backend/postgres_bundle
            fi

            cd /var/www/anhemmotor/backend

            UPLOAD_PATH=$(python3 -c "import json; d=json.load(open('appsettings.Production.json')); print(d.get('LocalFileStorage',{}).get('UploadPath') or '')" 2>/dev/null || echo "")

            if [ -z "$UPLOAD_PATH" ]; then
              TARGET="/var/www/anhemmotor/backend/wwwroot/uploads";
            elif [[ "$UPLOAD_PATH" = /* ]]; then
              TARGET="$UPLOAD_PATH";
            else
              TARGET="/var/www/anhemmotor/backend/$UPLOAD_PATH";
            fi

            mkdir -p "$TARGET"; cp -rn SeedUploads/. "$TARGET/"; rm -rf SeedUploads

            sudo systemctl restart anhemmotor.service
