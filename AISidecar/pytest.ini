[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:google.*
    ignore:.*starlette\.testclient.*
    ignore:.*httpx.*
    ignore:.*allowed_objects.*:langchain_core._api.deprecation.LangChainPendingDeprecationWarning
