[project]
name = "anhemmotor-ai-sidecar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.140",
    "uvicorn[standard]>=0.32,<0.52",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<0.29",
    "langchain-core>=0.3,<2",
    "langchain-google-genai>=2.0,<5",
    "langchain-ollama>=1.0,<2",
    "langgraph>=0.2,<2",
    "qdrant-client>=1.12,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]
